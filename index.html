<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hennycam.live</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Hennycam.live</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>Welcome to Hennycam.live — a simple starter site.</p>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div class="cards">
        <article class="card">
          <h3>Project One</h3>
          <p>Short description.</p>
        </article>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contact-form">
        <label>
          Name
          <input type="text" name="name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Message
          <textarea name="message" required></textarea>
        </label>
        <button type="submit">Send</button>
      </form>
      <div id="form-result" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Hennycam.live</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
